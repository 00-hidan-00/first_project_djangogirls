<header class="header">
    <div class="header__container">
        <div class="header__body">
            <a href="{% url 'blog:post_list' %}" class="header__link-logo">Django Blog</a>
            <nav class="header__menu menu">
                <ul class="menu__list">
                    {% if user.is_authenticated %}
                        <li class="menu__item">
                            <a href="{% url 'blog:post_new' %}" class="menu__button button button--mini">Post New</a>
                        </li>
                        <li class="menu__item">
                            <a href="{% url 'blog:post_draft_list' %}"
                               class="menu__button button button--mini">Drafts</a>
                        </li>
                    {% endif %}
                    <li class="menu__item">
                        <a href="{% url 'blog:favorite_posts' %}"
                           class="menu__button button button--mini">Favorites</a>
                    </li>
                    {% if user.is_authenticated %}
                        <li class="menu__item">
                            <form action="{% url 'account:logout' %}" method="post">
                                {% csrf_token %}
                                <button class="menu__button button button--white-border button--mini" type="submit"
                                        title="Logout">
                                    Logout
                                </button>
                            </form>
                        </li>
                    {% else %}
                        <li class="menu__item">
                            <a class="menu__button button button--white-border button--mini"
                               href="{% url 'account:signup' %}">Sign Up</a>
                        </li>
                        <li class="menu__item">
                            <a class="menu__button button button--mini" href="{% url 'account:login' %}">Login</a>
                        </li>
                    {% endif %}
                </ul>
            </nav>
        </div>
    </div>
</header>
